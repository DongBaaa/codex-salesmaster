name: georaeplan

x-georaeplan-logging: &georaeplan-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: georaeplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-거래플랜}
      POSTGRES_USER: ${POSTGRES_USER:-sm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - georaeplan_postgres_data:/var/lib/postgresql/data
    logging: *georaeplan-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sm_user} -d ${POSTGRES_DB:-거래플랜}" ]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    container_name: georaeplan-api
    build:
      context: ..
      dockerfile: Server/거래플랜.Server.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:18080
      Database__EnableSqliteFallback: false
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-거래플랜};Username=${POSTGRES_USER:-sm_user};Password=${POSTGRES_PASSWORD:-change_me}
      ConnectionStrings__USENET_GROUP: Host=postgres;Port=5432;Database=${USENET_POSTGRES_DB:-georaeplan_usenet};Username=${POSTGRES_USER:-sm_user};Password=${POSTGRES_PASSWORD:-change_me}
      ConnectionStrings__ITWORLD: Host=postgres;Port=5432;Database=${ITWORLD_POSTGRES_DB:-georaeplan_itworld};Username=${POSTGRES_USER:-sm_user};Password=${POSTGRES_PASSWORD:-change_me}
      Jwt__Issuer: ${JWT_ISSUER:-거래플랜}
      Jwt__Audience: ${JWT_AUDIENCE:-georaeplan-client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-거래플랜_ChangeThisSigningKeyForProduction_AtLeast32Chars}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-43200}
    ports:
      - "${API_PORT:-18080}:18080"
    logging: *georaeplan-logging

volumes:
  georaeplan_postgres_data:
    name: georaeplan-dev-postgres-data
