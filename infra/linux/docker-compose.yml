name: georaeplan

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-georaeplan}
      POSTGRES_USER: ${POSTGRES_USER:-georaeplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-15434}:5432"
    volumes:
      - "${GEORAEPLAN_ROOT_PATH:-/srv/georaeplan}/data/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-georaeplan} -d ${POSTGRES_DB:-georaeplan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "exec dotnet /app/*.Server.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      TZ: ${TZ:-Asia/Seoul}
      Database__EnableSqliteFallback: false
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-georaeplan};Username=${POSTGRES_USER:-georaeplan};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__ITWORLD: Host=postgres;Port=5432;Database=${ITWORLD_POSTGRES_DB:-georaeplan_itworld};Username=${POSTGRES_USER:-georaeplan};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-georaeplan}
      Jwt__Audience: ${JWT_AUDIENCE:-georaeplan-client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set in .env}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-43200}
      Security__EnableRateLimiting: ${SECURITY_ENABLE_RATE_LIMITING:-true}
      Security__LoginPermitLimitPerMinute: ${SECURITY_LOGIN_PERMIT_LIMIT_PER_MINUTE:-60}
      Security__ApiPermitLimitPerMinute: ${SECURITY_API_PERMIT_LIMIT_PER_MINUTE:-300}
      Security__AddSecurityHeaders: ${SECURITY_ADD_SECURITY_HEADERS:-true}
      Security__RequireHttpsForwardedProto: ${SECURITY_REQUIRE_HTTPS_FORWARDED_PROTO:-true}
      Security__AllowAnyCorsOrigin: ${SECURITY_ALLOW_ANY_CORS_ORIGIN:-false}
      Security__AllowedCorsOrigins__0: ${SECURITY_ALLOWED_CORS_ORIGIN_0:-}
      ClientCompatibility__Mode: ${CLIENT_COMPATIBILITY_MODE:-AuditOnly}
      ClientCompatibility__Policies__0__Enabled: ${CLIENT_COMPATIBILITY_DESKTOP_ENABLED:-false}
      ClientCompatibility__Policies__0__AppId: ${CLIENT_COMPATIBILITY_DESKTOP_APP_ID:-kr.georaeplan.desktop}
      ClientCompatibility__Policies__0__Platform: ${CLIENT_COMPATIBILITY_DESKTOP_PLATFORM:-windows}
      ClientCompatibility__Policies__0__PolicyVersion: ${CLIENT_COMPATIBILITY_DESKTOP_POLICY_VERSION:-1}
      ClientCompatibility__Policies__0__RequiresUserAction: ${CLIENT_COMPATIBILITY_DESKTOP_REQUIRES_USER_ACTION:-true}
      ClientCompatibility__Policies__0__MinimumVersion: ${CLIENT_COMPATIBILITY_DESKTOP_MINIMUM_VERSION:-}
      ClientCompatibility__Policies__0__MinimumBuild: ${CLIENT_COMPATIBILITY_DESKTOP_MINIMUM_BUILD:-}
      ClientCompatibility__Policies__0__MinimumProtocolVersion: ${CLIENT_COMPATIBILITY_DESKTOP_MINIMUM_PROTOCOL_VERSION:-}
      ClientCompatibility__Policies__0__LatestVersion: ${CLIENT_COMPATIBILITY_DESKTOP_LATEST_VERSION:-}
      ClientCompatibility__Policies__0__LatestBuild: ${CLIENT_COMPATIBILITY_DESKTOP_LATEST_BUILD:-}
      ClientCompatibility__Policies__0__UpdateUrl: ${CLIENT_COMPATIBILITY_DESKTOP_UPDATE_URL:-/updates/manifest?channel=stable}
      ClientCompatibility__Policies__0__UpgradeToken: ${CLIENT_COMPATIBILITY_DESKTOP_UPGRADE_TOKEN:-georaeplan-client}
      ClientCompatibility__Policies__1__Enabled: ${CLIENT_COMPATIBILITY_ANDROID_ENABLED:-false}
      ClientCompatibility__Policies__1__AppId: ${CLIENT_COMPATIBILITY_ANDROID_APP_ID:-kr.georaeplan.mobile}
      ClientCompatibility__Policies__1__Platform: ${CLIENT_COMPATIBILITY_ANDROID_PLATFORM:-android}
      ClientCompatibility__Policies__1__PolicyVersion: ${CLIENT_COMPATIBILITY_ANDROID_POLICY_VERSION:-1}
      ClientCompatibility__Policies__1__RequiresUserAction: ${CLIENT_COMPATIBILITY_ANDROID_REQUIRES_USER_ACTION:-true}
      ClientCompatibility__Policies__1__MinimumVersion: ${CLIENT_COMPATIBILITY_ANDROID_MINIMUM_VERSION:-}
      ClientCompatibility__Policies__1__MinimumBuild: ${CLIENT_COMPATIBILITY_ANDROID_MINIMUM_BUILD:-}
      ClientCompatibility__Policies__1__MinimumProtocolVersion: ${CLIENT_COMPATIBILITY_ANDROID_MINIMUM_PROTOCOL_VERSION:-}
      ClientCompatibility__Policies__1__LatestVersion: ${CLIENT_COMPATIBILITY_ANDROID_LATEST_VERSION:-}
      ClientCompatibility__Policies__1__LatestBuild: ${CLIENT_COMPATIBILITY_ANDROID_LATEST_BUILD:-}
      ClientCompatibility__Policies__1__UpdateUrl: ${CLIENT_COMPATIBILITY_ANDROID_UPDATE_URL:-/updates/manifest?channel=stable}
      ClientCompatibility__Policies__1__UpgradeToken: ${CLIENT_COMPATIBILITY_ANDROID_UPGRADE_TOKEN:-georaeplan-client}
      SeedUsers__EnableSeedUsers: ${SEED_USERS_ENABLE_SEED_USERS:-true}
      SeedUsers__AdminPassword: ${SEED_USERS_ADMIN_PASSWORD:-}
      SeedUsers__UserPassword: ${SEED_USERS_USER_PASSWORD:-}
      SeedUsers__ItwPassword: ${SEED_USERS_ITW_PASSWORD:-}
      SeedUsers__UpdateExistingItwPassword: ${SEED_USERS_UPDATE_EXISTING_ITW_PASSWORD:-true}
      SeedUsers__WarnOnDefaultPasswords: ${SEED_USERS_WARN_ON_DEFAULT_PASSWORDS:-true}
      FileStorage__RootPath: /storage/files
      DataProtection__KeyRingPath: /storage/data-protection-keys
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-18082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "${GEORAEPLAN_ROOT_PATH:-/srv/georaeplan}/app/live:/app:ro"
      - "${GEORAEPLAN_ROOT_PATH:-/srv/georaeplan}/storage/files:/storage/files"
      - "${GEORAEPLAN_ROOT_PATH:-/srv/georaeplan}/storage/data-protection-keys:/storage/data-protection-keys"
